server:
  host: "0.0.0.0"
  port: 14450
  max_connections: 10000
  default_zoom: 2
  # Idle timeout: kick sessions không hoạt động sau N giây
  idle_timeout_secs: 300
  # Max cache size (MB). 0 = unlimited
  max_cache_mb: 512
  # In stats mỗi N giây
  stats_interval_secs: 60

paths:
  base_dir: "./data"

  # Icon sprites (PNG)
  # Ví dụ: ./data/x2/icon/123.png
  icon: "{base}/x{zoom}/icon/{id}.png"

  # Effect data (binary)
  # Ví dụ: ./data/x2/effectdata/45.dat
  effect: "{base}/x{zoom}/effect/data/DataEffect_{id}"

  effect_image: "{base}/x{zoom}/effect/img/ImgEffect_{id}.png"

  # Map template (binary)
  # Ví dụ: ./data/x2/map/7.dat
  map: "{base}/x{zoom}/map/{id}.dat"

  # NPC template (binary)
  # Ví dụ: ./data/x2/npc/10.dat
  npc: "{base}/x{zoom}/mob/{id}"

  background: "{base}/x{zoom}/bg/{id}.png"

  # Tile set
  # Ví dụ: ./data/x2/tileset/5.dat
  tileset: "{base}/x{zoom}/tileset/{id}.dat"

  # Image source (không có {id}, dùng cho cả session)
  image_source: "{base}/x{zoom}/imagesource.dat"
  image_source2: "{base}/x{zoom}/imagesource2.dat"

  # Version files
  smallimage_version: "{base}/x{zoom}/smallimage_version.dat"
  bgitem_version: "{base}/x{zoom}/bgitem_version.dat"

  item_option_template: "{base}/binary/item_option_template.bin"
  item_template: "{base}/binary/item_template.bin"
  head_avatar: "{base}/binary/head_avatar.bin"
  head_2_frame: "{base}/binary/arr_head_2_frame.bin"

  img_by_name: "{base}/img_by_name/{name}.png"