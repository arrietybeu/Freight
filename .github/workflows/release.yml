name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binary
        working-directory: server
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package artifact
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $outDir = "freight-$version-windows-x64"
          New-Item -ItemType Directory -Path $outDir

          Copy-Item "server\target\x86_64-pc-windows-msvc\release\freight.exe" "$outDir\freight.exe"
          Copy-Item "server\config.yml" "$outDir\config.yml"

          Compress-Archive -Path "$outDir\*" -DestinationPath "$outDir.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Freight ${{ github.ref_name }}"
          body: |
            ## Freight CDN Server ${{ github.ref_name }}

            ### Cài đặt
            1. Giải nén file zip
            2. Chỉnh sửa `config.yml` theo môi trường của bạn
            3. Chạy `freight.exe`

            ### Thay đổi
            ${{ github.event.head_commit.message }}
          files: freight-${{ github.ref_name }}-windows-x64.zip
          draft: false
          prerelease: false
